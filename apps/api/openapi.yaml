components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-educonnect-session
      description: Host-only first-party session cookie issued by Laravel.
    xsrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Decoded value of the XSRF-TOKEN cookie.
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-educonnect-session
      description: >-
        Host-only session cookie whose admin guard state is isolated from the
        student session and accepted only through the admin gateway.
  parameters:
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    UserPublicId:
      name: user
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UserPublicId'
    VerificationHash:
      name: hash
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-f0-9]{40}$'
    Expires:
      name: expires
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    Signature:
      name: signature
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    OnboardingStep:
      name: step
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OnboardingStepKey'
    AcademicTermPublicId:
      name: term
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AcademicPublicId'
    CoursePublicId:
      name: course
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AcademicPublicId'
    AcademicTermSearch:
      name: search
      in: query
      required: false
      description: Case-insensitive label-prefix search scoped to the current user.
      schema:
        type: string
        minLength: 1
        maxLength: 80
    CourseSearch:
      name: search
