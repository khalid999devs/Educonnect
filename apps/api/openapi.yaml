components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-educonnect-session
      description: Host-only first-party session cookie issued by Laravel.
    xsrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Decoded value of the XSRF-TOKEN cookie.
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-educonnect-session
      description: >-
        Host-only session cookie whose admin guard state is isolated from the
        student session and accepted only through the admin gateway.
  parameters:
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    UserPublicId:
      name: user
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UserPublicId'
    VerificationHash:
      name: hash
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-f0-9]{40}$'
    Expires:
      name: expires
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    Signature:
      name: signature
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    OnboardingStep:
      name: step
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OnboardingStepKey'
    AcademicTermPublicId:
      name: term
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AcademicPublicId'
    CoursePublicId:
      name: course
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AcademicPublicId'
    AcademicTermSearch:
      name: search
      in: query
      required: false
      description: Case-insensitive label-prefix search scoped to the current user.
      schema:
        type: string
        minLength: 1
        maxLength: 80
    CourseSearch:
      name: search
      in: query
      required: false
      description: Case-insensitive title-or-code prefix search scoped to the current user.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    AcademicSort:
      name: sort
      in: query
      required: false
      description: Private academic text is intentionally excluded from cursor sort values.
      schema:
        type: string
        default: '-updated_at'
        enum:
          - created_at
          - '-created_at'
          - updated_at
          - '-updated_at'
    AcademicPerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    AcademicCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor containing only a timestamp, public ULID, and direction flag.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    TaskPublicId:
      name: task
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PlannerPublicId'
    FocusSessionPublicId:
      name: focus_session
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PlannerPublicId'
    PlannerTaskSearch:
      name: search
      in: query
      required: false
      description: Case-insensitive title-prefix search scoped to the current user.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    PlannerTaskSort:
      name: sort
      in: query
      required: false
      description: Task cursors contain only an update timestamp, public ULID, and direction flag.
      schema:
        type: string
        default: '-updated_at'
        enum:
          - updated_at
          - '-updated_at'
    PlannerFocusSort:
      name: sort
      in: query
      required: false
      description: Focus-session cursors contain only a start timestamp, public ULID, and direction flag.
      schema:
        type: string
        default: starts_at
        enum:
          - starts_at
          - '-starts_at'
    PlannerPerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    PlannerCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor containing only a timestamp, public ULID, and direction flag.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    PlannerTimezone:
      name: timezone
      in: query
      required: true
      description: A PHP-supported IANA timezone used to derive daylight-saving-safe local boundaries.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        example: Asia/Dhaka
    PlannerWindowLimit:
      name: limit
      in: query
      required: false
      description: Maximum tasks and maximum focus sessions returned in this bounded window.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  headers:
    RequestId:
      description: Correlates the response body with request-scoped logs.
      required: true
      schema:
        $ref: '#/components/schemas/RequestId'
  responses:
    UserCreated:
      description: The account and unverified browser session were created.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserSuccess'
    UserSuccess:
      description: The operation returned the current public user representation.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserSuccess'
    OnboardingSuccess:
      description: The operation returned the current user's complete onboarding snapshot.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OnboardingSuccess'
    AcademicTermCreated:
      description: The user-owned academic term was created.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
