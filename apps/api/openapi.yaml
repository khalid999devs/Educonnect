openapi: 3.0.4
info:
  title: EduConnect API
  version: 1.0.0
  description: >-
    Canonical liveness, readiness, request-ID, response-envelope, and
    first-party cookie-authentication contracts. Browser clients initialize
    Sanctum CSRF cookies before sending state-changing requests.
tags:
  - name: Health
    description: Process liveness and dependency readiness probes.
  - name: Authentication
    description: First-party browser session, credential, and email-ownership flows.
  - name: Administration
    description: Isolated first-party administration session and access-shell flows.
  - name: Onboarding
    description: Verified, current-user academic profile and resumable onboarding flows.
  - name: Courses
    description: Verified, current-user academic terms and independent course workspaces.
  - name: Planner
    description: Verified, current-user tasks, focus sessions, agenda, and weekly planning.
paths:
  /sanctum/csrf-cookie:
    get:
      tags:
        - Authentication
      operationId: initializeCsrfCookie
      summary: Initialize the first-party browser CSRF cookie
      responses:
        '204':
          description: CSRF and session cookies were initialized.
  /api/v1/health:
    get:
      tags:
        - Health
      operationId: getApiLiveness
      summary: Report API process liveness
      responses:
        '200':
          description: The API process is running.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessSuccess'
              example:
                data:
                  status: up
                meta:
                  request_id: req_00000000000000000000000000000000
  /api/v1/health/readiness:
    get:
      tags:
        - Health
      operationId: getApiReadiness
      summary: Report API dependency readiness
      responses:
        '200':
          description: The API and its required dependencies are ready.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessSuccess'
              example:
                data:
                  status: ready
                  checks:
                    database: up
                meta:
                  request_id: req_11111111111111111111111111111111
        '503':
          description: A required dependency is unavailable.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
              example:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: The service is not ready to receive traffic.
                  request_id: req_22222222222222222222222222222222
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      operationId: registerUser
      summary: Register a user and establish an unverified session
      security:
        - xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          $ref: '#/components/responses/UserCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      operationId: loginUser
      summary: Authenticate a user and rotate the browser session
      security:
        - xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/forgot-password:
    post:
      tags:
        - Authentication
      operationId: requestPasswordReset
      summary: Queue a password-reset notification when the account exists
      description: The response is identical for known and unknown canonical email addresses.
      security:
        - xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/reset-password:
    post:
      tags:
        - Authentication
      operationId: resetPassword
      summary: Consume a reset token and revoke every existing session
      security:
        - xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/MessageSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/verify-email/{user}/{hash}:
    get:
      tags:
        - Authentication
      operationId: verifyEmail
      summary: Verify the authenticated user's email with a temporary signed URL
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserPublicId'
        - $ref: '#/components/parameters/VerificationHash'
        - $ref: '#/components/parameters/Expires'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          $ref: '#/components/responses/UserSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/email/verification-notification:
    post:
      tags:
        - Authentication
      operationId: resendEmailVerification
      summary: Queue a fresh verification notification when still unverified
      security:
        - sessionCookie: []
          xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      operationId: logoutCurrentSession
      summary: Revoke the current browser session
      security:
        - sessionCookie: []
          xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          $ref: '#/components/responses/NullSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
  /api/v1/auth/logout-all:
    post:
      tags:
        - Authentication
      operationId: logoutAllSessions
      summary: Revoke all browser sessions for the authenticated user
      security:
        - sessionCookie: []
          xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentPasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/NullSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/me:
    get:
      tags:
        - Authentication
      operationId: getCurrentUser
      summary: Return the authenticated user
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/UserSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /api/v1/auth/me:
    get:
      deprecated: true
      tags:
        - Authentication
      operationId: getCurrentUserCompatibilityAlias
      summary: Return the authenticated user through the compatibility alias
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/UserSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /api/v1/onboarding:
    get:
      tags:
        - Onboarding
      operationId: getOnboarding
      summary: Return the current user's resumable onboarding snapshot
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/OnboardingSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/onboarding/steps/{step}:
    put:
      tags:
        - Onboarding
      operationId: updateOnboardingStep
      summary: Idempotently replace one current-user onboarding step
      description: >-
        The request variant must correspond to the step path value. Repeating
        identical canonical content is a no-op even when expected_version is
        stale; stale requests containing different content receive 409.
      security:
        - sessionCookie: []
          xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/OnboardingStep'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingStepUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/OnboardingSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/onboarding/completion:
    put:
      tags:
        - Onboarding
      operationId: completeOnboarding
      summary: Idempotently complete the current user's onboarding
      description: >-
        Completion requires an institution, terminal step choices, and at
        least one course draft, goal, or problem. Replays retain the original
        completion timestamp.
      security:
        - sessionCookie: []
          xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteOnboardingRequest'
      responses:
        '200':
          $ref: '#/components/responses/OnboardingSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '409':
          $ref: '#/components/responses/Conflict'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/academic-terms:
    get:
      tags:
        - Courses
      operationId: listAcademicTerms
      summary: List the current user's academic terms
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AcademicTermSearch'
        - $ref: '#/components/parameters/AcademicSort'
        - $ref: '#/components/parameters/AcademicPerPage'
        - $ref: '#/components/parameters/AcademicCursor'
      responses:
        '200':
          $ref: '#/components/responses/AcademicTermCollectionSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags:
        - Courses
      operationId: createAcademicTerm
      summary: Create a current-user academic term
      security:
        - sessionCookie: []
          xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicTermWriteRequest'
      responses:
        '201':
          $ref: '#/components/responses/AcademicTermCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/academic-terms/{term}:
    parameters:
      - $ref: '#/components/parameters/AcademicTermPublicId'
    get:
      tags:
        - Courses
      operationId: getAcademicTerm
      summary: Return one current-user academic term
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/AcademicTermSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      tags:
        - Courses
      operationId: updateAcademicTerm
      summary: Replace one current-user academic term
      description: An exact canonical retry is a no-op even when expected_version is stale.
      security:
        - sessionCookie: []
          xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicTermUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/AcademicTermSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags:
        - Courses
      operationId: deleteAcademicTerm
      summary: Permanently delete an unused current-user academic term
      description: Terms referenced by any active or archived course return 409.
      security:
        - sessionCookie: []
          xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedMutationRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/courses:
    get:
      tags:
        - Courses
      operationId: listCourses
      summary: List and summarize the current user's courses
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CourseSearch'
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: active
            enum:
              - active
              - archived
              - all
        - name: term_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AcademicPublicId'
        - $ref: '#/components/parameters/AcademicSort'
        - $ref: '#/components/parameters/AcademicPerPage'
        - $ref: '#/components/parameters/AcademicCursor'
      responses:
        '200':
          $ref: '#/components/responses/CourseCollectionSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags:
        - Courses
      operationId: createCourse
      summary: Create a current-user course workspace
      security:
        - sessionCookie: []
          xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseWriteRequest'
      responses:
        '201':
          $ref: '#/components/responses/CourseCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/courses/{course}:
    parameters:
      - $ref: '#/components/parameters/CoursePublicId'
    get:
      tags:
        - Courses
      operationId: getCourse
      summary: Return one current-user course workspace
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/CourseSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      tags:
        - Courses
      operationId: updateCourse
      summary: Replace one current-user course workspace
      description: An exact canonical retry is a no-op even when expected_version is stale.
      security:
        - sessionCookie: []
          xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/CourseSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags:
        - Courses
      operationId: deleteCourse
      summary: Permanently delete one current-user course workspace
      security:
        - sessionCookie: []
          xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedMutationRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/courses/{course}/archive:
    parameters:
      - $ref: '#/components/parameters/CoursePublicId'
    put:
      tags:
        - Courses
      operationId: archiveCourse
      summary: Archive one current-user course
      description: Repeating the archive action is a no-op even with a stale expected_version.
      security:
        - sessionCookie: []
          xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedMutationRequest'
      responses:
        '200':
          $ref: '#/components/responses/CourseSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags:
        - Courses
      operationId: restoreCourse
      summary: Restore one archived current-user course
      description: Repeating the restore action is a no-op even with a stale expected_version.
      security:
        - sessionCookie: []
          xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedMutationRequest'
      responses:
        '200':
          $ref: '#/components/responses/CourseSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/tasks:
    get:
      tags:
        - Planner
      operationId: listTasks
      summary: List the current user's tasks
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PlannerTaskSearch'
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: all
            enum:
              - pending
              - in_progress
              - completed
              - all
        - name: archive_status
          in: query
          required: false
