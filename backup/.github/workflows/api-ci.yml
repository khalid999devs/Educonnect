name: EduConnect Quality CI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.node-version'
      - '.tool-versions'
      - '.editorconfig'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.node-version'
      - '.tool-versions'
      - '.editorconfig'
      - '.github/workflows/api-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-quality:
    name: Workspace and API quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: educonnect_test
          POSTGRES_USER: postgres
          # CI-only disposable database; avoid committing throwaway credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d educonnect_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: educonnect_test
      DB_USERNAME: postgres
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/.cache/composer

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.node-version'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5.8'
          extensions: mbstring, pdo_pgsql
          coverage: none
          tools: composer:2.10.2
        env:
          fail-fast: true

      - name: Restore Composer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: ${{ runner.os }}-php-8.5.8-composer-2.10.2-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5.8-composer-2.10.2-

      - name: Verify pinned toolchain
        run: pnpm run versions:check
        working-directory: ${{ github.workspace }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configure application
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Verify PHP platform requirements
        run: composer check-platform-reqs

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level=high
        working-directory: ${{ github.workspace }}

      - name: Verify database migrations
        run: php artisan migrate:fresh --force

      - name: Run workspace quality checks
        run: pnpm run check
        working-directory: ${{ github.workspace }}
