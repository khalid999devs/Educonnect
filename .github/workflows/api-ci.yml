name: Laravel API CI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-quality:
    name: API quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: educonnect_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d educonnect_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: educonnect_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/.cache/composer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true

      - name: Restore Composer cache
        uses: actions/cache@v6
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configure application
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Verify PHP platform requirements
        run: composer check-platform-reqs

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Verify database migrations
        run: php artisan migrate:fresh --force

      - name: Check PHP formatting
        run: composer exec pint -- --test

      - name: Run API test suite
        run: php artisan test
