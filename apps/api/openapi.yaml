  schemas:
    RequestId:
      type: string
      description: A non-semantic, request-scoped correlation identifier.
      pattern: '^req_[a-f0-9]{32}$'
      example: req_0123456789abcdef0123456789abcdef
    ResponseMeta:
      type: object
      required:
        - request_id
      additionalProperties: false
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
    SuccessEnvelope:
      type: object
      required:
        - data
        - meta
      additionalProperties: false
      properties:
        data:
          type: object
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
        message:
          type: string
          minLength: 1
        details:
          type: object
        request_id:
          $ref: '#/components/schemas/RequestId'
    ErrorEnvelope:
      type: object
      required:
        - error
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
