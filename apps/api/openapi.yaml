openapi: 3.0.4
info:
  title: EduConnect API
  version: 1.0.0
  description: >-
    Canonical liveness, readiness, request-ID, response-envelope, and
    first-party cookie-authentication contracts. Browser clients initialize
    Sanctum CSRF cookies before sending state-changing requests.
tags:
  - name: Health
    description: Process liveness and dependency readiness probes.
  - name: Authentication
    description: First-party browser session, credential, and email-ownership flows.
  - name: Administration
    description: Isolated first-party administration session and access-shell flows.
paths:
  /sanctum/csrf-cookie:
    get:
      tags:
        - Authentication
      operationId: initializeCsrfCookie
      summary: Initialize the first-party browser CSRF cookie
      responses:
        '204':
          description: CSRF and session cookies were initialized.
  /api/v1/health:
    get:
      tags:
        - Health
      operationId: getApiLiveness
      summary: Report API process liveness
      responses:
        '200':
          description: The API process is running.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessSuccess'
              example:
                data:
                  status: up
                meta:
                  request_id: req_00000000000000000000000000000000
  /api/v1/health/readiness:
    get:
      tags:
        - Health
      operationId: getApiReadiness
      summary: Report API dependency readiness
      responses:
        '200':
          description: The API and its required dependencies are ready.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessSuccess'
              example:
                data:
                  status: ready
                  checks:
                    database: up
                meta:
                  request_id: req_11111111111111111111111111111111
        '503':
          description: A required dependency is unavailable.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
              example:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: The service is not ready to receive traffic.
                  request_id: req_22222222222222222222222222222222
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      operationId: registerUser
      summary: Register a user and establish an unverified session
      security:
        - xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          $ref: '#/components/responses/UserCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      operationId: loginUser
      summary: Authenticate a user and rotate the browser session
      security:
        - xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/forgot-password:
    post:
      tags:
        - Authentication
      operationId: requestPasswordReset
      summary: Queue a password-reset notification when the account exists
      description: The response is identical for known and unknown canonical email addresses.
      security:
        - xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/reset-password:
    post:
      tags:
        - Authentication
      operationId: resetPassword
      summary: Consume a reset token and revoke every existing session
      security:
        - xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/MessageSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/verify-email/{user}/{hash}:
    get:
      tags:
        - Authentication
      operationId: verifyEmail
      summary: Verify the authenticated user's email with a temporary signed URL
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserPublicId'
        - $ref: '#/components/parameters/VerificationHash'
        - $ref: '#/components/parameters/Expires'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          $ref: '#/components/responses/UserSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/email/verification-notification:
    post:
      tags:
        - Authentication
      operationId: resendEmailVerification
      summary: Queue a fresh verification notification when still unverified
      security:
        - sessionCookie: []
          xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      operationId: logoutCurrentSession
      summary: Revoke the current browser session
      security:
        - sessionCookie: []
          xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          $ref: '#/components/responses/NullSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
  /api/v1/auth/logout-all:
    post:
      tags:
        - Authentication
      operationId: logoutAllSessions
      summary: Revoke all browser sessions for the authenticated user
      security:
        - sessionCookie: []
          xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentPasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/NullSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/me:
    get:
      tags:
        - Authentication
      operationId: getCurrentUser
      summary: Return the authenticated user
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/UserSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /api/v1/auth/me:
    get:
      deprecated: true
      tags:
        - Authentication
      operationId: getCurrentUserCompatibilityAlias
      summary: Return the authenticated user through the compatibility alias
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/UserSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /api/v1/admin/auth/login:
    post:
      tags:
        - Administration
      operationId: loginAdministrator
      summary: Authenticate an authorized administrator into an isolated admin session
      description: Invalid credentials and accounts without admin access share the same response.
      security:
        - xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminSessionSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/auth/logout:
    post:
      tags:
        - Administration
      operationId: logoutAdministrator
      summary: Revoke the current isolated administration session
      security:
        - adminSessionCookie: []
          xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          $ref: '#/components/responses/NullSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
  /api/v1/admin/me:
    get:
      tags:
        - Administration
      operationId: getCurrentAdministrator
      summary: Return the authorized administration identity and capabilities
      security:
        - adminSessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/AdminSessionSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-educonnect-session
      description: Host-only first-party session cookie issued by Laravel.
    xsrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Decoded value of the XSRF-TOKEN cookie.
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-educonnect-session
      description: >-
        Host-only session cookie whose admin guard state is isolated from the
        student session and accepted only through the admin gateway.
  parameters:
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    UserPublicId:
      name: user
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UserPublicId'
    VerificationHash:
      name: hash
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-f0-9]{40}$'
    Expires:
      name: expires
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    Signature:
      name: signature
      in: query
      required: true
      schema:
        type: string
        minLength: 1
  headers:
    RequestId:
      description: Correlates the response body with request-scoped logs.
      required: true
      schema:
        $ref: '#/components/schemas/RequestId'
  responses:
    UserCreated:
      description: The account and unverified browser session were created.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserSuccess'
    UserSuccess:
      description: The operation returned the current public user representation.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserSuccess'
    AdminSessionSuccess:
      description: The operation returned the authorized administration identity.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminSessionSuccess'
    NullSuccess:
      description: The operation completed successfully.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NullSuccess'
    Accepted:
      description: The request was accepted without disclosing account existence or state.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageSuccess'
    MessageSuccess:
      description: The operation completed and returned safe user-facing status copy.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageSuccess'
    BadRequest:
      description: The request was not recognized as a stateful first-party browser request.
      $ref: '#/components/responses/GenericError'
    AuthenticationRequired:
      description: An authenticated browser session is required.
      $ref: '#/components/responses/GenericError'
    AuthorizationDenied:
      description: The signed URL or authenticated user is not authorized.
      $ref: '#/components/responses/GenericError'
    NotFound:
      description: The requested public identifier was not found.
      $ref: '#/components/responses/GenericError'
    CsrfMismatch:
      description: The CSRF token is invalid or expired.
      $ref: '#/components/responses/GenericError'
    ValidationFailed:
      description: One or more request fields failed validation.
      $ref: '#/components/responses/GenericError'
    RateLimited:
      description: The account or source IP has temporarily exhausted its request allowance.
      $ref: '#/components/responses/GenericError'
    GenericError:
      description: A stable API error envelope.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    RequestId:
      type: string
      description: A non-semantic, request-scoped correlation identifier.
      pattern: '^req_[a-f0-9]{32}$'
      example: req_0123456789abcdef0123456789abcdef
    ResponseMeta:
      type: object
      required:
        - request_id
      additionalProperties: false
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
    SuccessEnvelope:
      type: object
      required:
        - data
        - meta
      additionalProperties: false
      properties:
        data:
          type: object
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
        message:
          type: string
          minLength: 1
        details:
          type: object
        request_id:
          $ref: '#/components/schemas/RequestId'
    ErrorEnvelope:
      type: object
      required:
        - error
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    UserPublicId:
      type: string
      pattern: '^[0-9abcdefghjkmnpqrstvwxyz]{26}$'
      example: 01jz6m5g0b7h2q3r4s5t6v7w8x
    RoleKey:
      type: string
      enum:
        - student
        - mentor
        - moderator
        - admin
        - super_admin
    CapabilityKey:
      type: string
      enum:
        - academic.manage-own
        - admin.access
        - moderation.scoped
        - moderation.global
        - users.private-support-access
        - users.suspend
        - content.curate
        - mentors.curate
        - authorization.roles-view
        - authorization.roles-assign
        - authorization.protected-roles-manage
        - authorization.capabilities-manage
        - audit.view-scoped
        - audit.view-all
    User:
      type: object
      required:
        - id
        - name
        - email
        - email_verified
        - primary_role
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/UserPublicId'
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        email_verified:
          type: boolean
        primary_role:
          $ref: '#/components/schemas/RoleKey'
    UserData:
      type: object
      required:
        - user
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
    UserSuccess:
      type: object
      required:
        - data
        - meta
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/UserData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminAuthorization:
      type: object
      required:
        - roles
        - capabilities
      additionalProperties: false
      properties:
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RoleKey'
        capabilities:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CapabilityKey'
    AdminSessionData:
      type: object
      required:
        - user
        - authorization
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
        authorization:
          $ref: '#/components/schemas/AdminAuthorization'
    AdminSessionSuccess:
      type: object
      required:
        - data
        - meta
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/AdminSessionData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    NullSuccess:
      type: object
      required:
        - data
        - meta
      additionalProperties: false
      properties:
        data:
          type: object
          nullable: true
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    MessageData:
      type: object
      required:
        - message
      additionalProperties: false
      properties:
        message:
          type: string
          minLength: 1
    MessageSuccess:
      type: object
      required:
        - data
        - meta
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/MessageData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
        - password_confirmation
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
        password_confirmation:
          type: string
          minLength: 8
          maxLength: 72
          format: password
    LoginRequest:
      type: object
      required:
        - email
        - password
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 72
          format: password
    ForgotPasswordRequest:
      type: object
      required:
        - email
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 255
    ResetPasswordRequest:
      type: object
      required:
        - token
        - email
        - password
        - password_confirmation
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
        password_confirmation:
          type: string
          minLength: 8
          maxLength: 72
          format: password
    CurrentPasswordRequest:
      type: object
      required:
        - password
      additionalProperties: false
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 72
          format: password
    LivenessData:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - up
    LivenessSuccess:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LivenessData'
    ReadinessChecks:
      type: object
      required:
        - database
      additionalProperties: false
      properties:
        database:
          type: string
          enum:
            - up
    ReadinessData:
      type: object
      required:
        - status
        - checks
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ready
        checks:
          $ref: '#/components/schemas/ReadinessChecks'
    ReadinessSuccess:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ReadinessData'
    ServiceUnavailableError:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          properties:
            error:
              allOf:
                - $ref: '#/components/schemas/ErrorBody'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                        - SERVICE_UNAVAILABLE
