    AcademicTermCollectionSuccess:
      description: The operation returned a cursor-paginated current-user term collection.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicTermCollectionSuccess'
    CourseCreated:
      description: The user-owned course workspace was created.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CourseSuccess'
    CourseSuccess:
